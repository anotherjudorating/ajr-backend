name: Update data

# Each run: new data from judobase, the rating from the first competition whose
# results changed, today's tables. Started by hand or by the Cloudflare Worker
# (cloudflare/worker.js): every 15 minutes; nightly with `full_rating` and `records`
# (the rating from scratch as a safety net; the records if results changed); on
# Monday nights with `full` and `check` (every competition fetched again, every table
# compared with production). What the nightly checks correct opens an issue.
# GitHub's own schedule fired only a few times a day.
#
# All of it on a working copy of production, so that production does none of the
# work (python -m ajr.publish): a Postgres here, restored from the previous run's
# copy (Actions cache) or, without one, from production; then only the rows that
# differ go to production, in one transaction, and the site is told to refresh if
# any did. Each step logs itself in the copy's job_run, published with the rest.
# It runs the code of the latest release, whose migrations the release workflow
# (release.yml) has applied to production; this run applies them to the copy.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do not write to production (it gets the changes and rolls them back)
        type: boolean
        default: false
      full:
        description: Re-fetch contests of every competition and rate from scratch
        type: boolean
        default: false
      full_rating:
        description: Rate from scratch (the nightly safety net), without re-fetching
        type: boolean
        default: false
      records:
        description: Recompute the records
        type: boolean
        default: false
      check:
        description: Compare every table with production at the end (reads all of production)
        type: boolean
        default: false
      fresh:
        description: Start from a new copy of production instead of the cached one
        type: boolean
        default: false

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # to delete the previous copy from the cache
  issues: write # to report what the nightly checks corrected

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # the jobs work on the copy; ajr.publish writes to production
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COPY: working-copy.dump
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags too
      - name: Use the latest release
        run: |
          git checkout "$(git describe --tags --abbrev=0)"
          # this workflow's scripts as on main (the release may predate them)
          git checkout "$GITHUB_SHA" -- .github/working-copy.sh .github/refresh-site.sh
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked

      - name: Postgres for the copy
        run: |
          # a throwaway database: no need to survive a crash, so fast writes
          docker run -d --name db -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            -v "$PWD:/work" postgres:17 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c shared_buffers=2GB -c work_mem=64MB -c maintenance_work_mem=512MB -c jit=off
          until docker exec db pg_isready -U postgres; do sleep 1; done
          docker exec db psql -U postgres -q -c "create role anon" -c "create role authenticated"

      - name: The previous copy
        id: cache
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.COPY }}
          key: working-copy-${{ github.run_id }}
          restore-keys: working-copy-

      - name: Restore the copy
        id: restore
        run: .github/working-copy.sh restore "${{ steps.cache.outputs.cache-matched-key }}"

      - name: Migrate the copy
        run: uv run alembic upgrade head

      - name: Sync judobase
        id: sync
        run: uv run python -m ajr.sync ${{ inputs.full && '--full' || '' }}
      - name: Rating
        id: rating
        run: uv run python -m ajr.rating ${{ (inputs.full || inputs.full_rating) && '--full' || '' }}
      - name: Records
        if: inputs.records
        # only if results changed since the last records (or a week passed), or the
        # full rating just corrected the history
        run: uv run python -m ajr.records ${{ steps.rating.outputs.corrected == '0' && '--if-changed' || '' }}

      - name: Publish
        id: publish
        run: uv run python -m ajr.publish publish ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Refresh the site
        if: steps.publish.outputs.changed == 'true'
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: .github/refresh-site.sh
      # Not a failure (the run fixed it), but something to look into: the 15-minute
      # sync missed changed results, or the runs since changes left the history
      # different from a full rating.
      - name: Report what the checks corrected
        if: ${{ !inputs.dry_run && (steps.sync.outputs.unannounced > 0 || steps.rating.outputs.corrected > 0) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UNANNOUNCED: ${{ steps.sync.outputs.unannounced }}
          NAMES: ${{ steps.sync.outputs.unannounced_names }}
          CORRECTED: ${{ steps.rating.outputs.corrected }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The nightly checks corrected the data"
          body="Run $RUN (published: the site has the corrected data)."
          [ "${UNANNOUNCED:-0}" -gt 0 ] && body="$body
          - The full sync found $UNANNOUNCED competitions whose results changed although judobase did not say so (the 15-minute sync misses them): $NAMES"
          [ "${CORRECTED:-0}" -gt 0 ] && body="$body
          - The full rating differed from the history the runs since changes had left in $CORRECTED rows: a change the sync did not mark, or a bug in rating from a day."
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
                  --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -z "$issue" ]; then gh issue create --title "$title" --body "$body"
          else gh issue comment "$issue" --body "$body"; fi

      # Also after a dry run or a failed step: what was not published stays to publish
      # (with the failed run in job_run), and the next run need not read all of
      # production again.
      - name: Save the copy
        if: always() && steps.restore.outcome == 'success'
        run: .github/working-copy.sh dump
      - uses: actions/cache/save@v6
        if: always() && steps.restore.outcome == 'success'
        with:
          path: ${{ env.COPY }}
          key: working-copy-${{ github.run_id }}
      - name: Delete the older copies
        if: always() && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key working-copy- --json key --jq '.[].key' |
            grep -vx "working-copy-${{ github.run_id }}" |
            xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"

      # last: a difference fails the run (an issue is opened), the copy is saved
      - name: Compare with production
        if: inputs.check
        run: uv run python -m ajr.publish check
