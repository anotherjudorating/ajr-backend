name: Update data

# Every 15 minutes: new data from judobase, then the rating recomputed from the
# first competition whose results changed (nothing changed: nothing to do).
# Nightly the rating is recomputed from scratch as a safety net, then the records
# (by hand: the `records` option).
# Each step logs itself in the job_run table; a failed step stops the rest.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "40 2 * * *" # nightly full rating (02:40 UTC)
  workflow_dispatch:
    inputs:
      full:
        description: Re-fetch contests of every competition and rate from scratch (~15 min)
        type: boolean
        default: false
      records:
        description: Recompute the records (~30 s)
        type: boolean
        default: false

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FULL_RATING: ${{ inputs.full || github.event.schedule == '40 2 * * *' }}
      RECORDS: ${{ inputs.records || github.event.schedule == '40 2 * * *' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Sync judobase
        run: uv run python -m ajr.sync ${{ inputs.full && '--full' || '' }}
      - name: Rating
        run: uv run python -m ajr.rating ${{ env.FULL_RATING == 'true' && '--full' || '' }}
      - name: Records
        if: env.RECORDS == 'true'
        run: uv run python -m ajr.records
