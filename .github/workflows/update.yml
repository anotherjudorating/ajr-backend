name: Update data

# Every 3 hours: new data from judobase, then the rating from scratch.
# Each step logs itself in the job_run table; a failed step stops the rest.
on:
  schedule:
    - cron: "17 */3 * * *" # not on the hour: GitHub's queue is long then
  workflow_dispatch:
    inputs:
      full:
        description: Re-fetch contests of every competition (about 15 minutes)
        type: boolean
        default: false

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Sync judobase
        run: uv run python -m ajr.sync ${{ inputs.full && '--full' || '' }}
      - name: Rating
        run: uv run python -m ajr.rating
