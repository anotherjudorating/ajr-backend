name: Release

# Publishing a release on GitHub deploys it: production is migrated with the
# release's code and the site is told to refresh (the API's functions may have
# changed), then an update run (update.yml) starts with this release's code: it
# migrates its working copy the same way, recomputes and publishes what changed. From
# then on every update run uses this release. Merging into main deploys nothing.
on:
  release:
    types: [published]

concurrency:
  group: update-data # never at the same time as the update job
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # to start the update run

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Refresh the site # the release may change what the API answers
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: .github/refresh-site.sh
      - name: Start an update run
        # it waits for this workflow to end (same concurrency group)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref main
