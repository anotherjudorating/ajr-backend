[project]
name = "ajr"
version = "0.1.0"
description = "Data sync and rating engine for Another Judo Rating"
authors = [
    { name = "DavidDzgoev", email = "ddzgoev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "judobase>=3.1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "sqlmodel>=0.0.25",
    "tenacity>=9.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ajr"]
# Research scripts that pick parameters on the real data: run by hand, not in production.
omit = ["*/ajr/rating/tune.py", "*/ajr/rating/tune_ranking.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
